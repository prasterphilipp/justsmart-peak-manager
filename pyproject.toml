[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "justsmart-peak-manager"
version = "0.1.0"
description = "Home Assistant Peak Manager for Austrian 15-minute grid demand tariffs"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [{name = "JustSmart"}]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
